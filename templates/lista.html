{% extends "template.html" %}
{% block conteudo %}
      <table class="table table-striped table-responsive table-bordered">
         <thead class="thead-default">
            <tr>
               <th>Nome</th>
               <th>Categoria</th>
               <th>Console</th>
               <th>Ações</th>
            </tr>
        </thead>
        <tbody>
         {% for jogo in jogos %}
           <tr>
              <td>{{ jogo.nome }}</td>
              <td>{{ jogo.categoria }}</td>
              <td>{{ jogo.console }}</td>
              <td>
                <a href="{{ url_for('editar', id=jogo.id) }}" class="btn btn-warning">Editar</a>
                  <a href="{{ url_for('deletar', id=jogo.id) }}" class="btn btn-danger">Deletar</a>
              </td>
           </tr>
         {% endfor %}
        </tbody>
     </table>
{% endblock %}
